name: Diagnostico temporal (manual)

on:
  workflow_dispatch:
    inputs:
      appid:
        description: "AppID de Steam a diagnosticar"
        required: false
        default: "606150"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/diagnose.mjs
        env:
          DIAG_APPID: ${{ inputs.appid }}
