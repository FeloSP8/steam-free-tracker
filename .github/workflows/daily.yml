name: Steam Free Games Daily Check

on:
  schedule:
    # Cada 6 horas. Los regalos de Steam duran pocos días y empiezan a
    # cualquier hora (Moonlighter arrancó a las 17:00 UTC), así que una única
    # pasada diaria a las 09:00 UTC dejaba ciega la mayor parte del día.
    # Solo se avisa de lo que no se había visto antes, así que más pasadas
    # no significan más correos.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tracker
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: npm start

      - name: Guardar estado de juegos ya notificados
        run: |
          if ! git diff --quiet -- data/seen.json; then
            git config user.name "steam-free-tracker-bot"
            git config user.email "actions@github.com"
            git add data/seen.json
            git commit -m "chore: actualizar juegos ya notificados"
            git push
          else
            echo "Sin cambios en data/seen.json"
          fi
